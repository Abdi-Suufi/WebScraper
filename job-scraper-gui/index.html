<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Scraper</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="loadingOverlay" class="loading-overlay">
        <div class="loader-mark">
            <i class="fas fa-magnifying-glass-chart"></i>
        </div>
        <h1>Job Scraper</h1>
        <p>Preparing your search workspace</p>
        <div class="loader-line"><span></span></div>
    </div>

    <div class="app-shell">
        <header class="topbar">
            <div class="brand">
                <div class="brand-mark">
                    <i class="fas fa-magnifying-glass-chart"></i>
                </div>
                <div>
                    <h1>Job Scraper</h1>
                    <span>Automated role discovery</span>
                </div>
            </div>

            <div class="topbar-actions">
                <div class="status-pill">
                    <span class="status-dot"></span>
                    <span id="statusText">Ready</span>
                </div>
                <button id="startSearch" class="btn btn-primary" type="button">
                    <i class="fas fa-play"></i>
                    <span>Start Search</span>
                </button>
                <button id="stopSearch" class="btn btn-secondary" type="button">
                    <i class="fas fa-stop"></i>
                    <span>Stop Auto Search</span>
                </button>
            </div>
        </header>

        <main class="workspace">
            <aside class="config-panel">
                <div class="panel-heading">
                    <span>Controls</span>
                    <i class="fas fa-sliders"></i>
                </div>

                <section class="control-group">
                    <label for="searchInterval">Search interval</label>
                    <div class="input-with-unit">
                        <input type="number" id="searchInterval" min="1" value="60">
                        <span>min</span>
                    </div>
                </section>

                <section class="control-group">
                    <label for="saveDirectory">Save directory</label>
                    <div class="joined-input">
                        <input type="text" id="saveDirectory" readonly>
                        <button id="selectDirectory" class="icon-button" type="button" title="Select directory">
                            <i class="fas fa-folder-open"></i>
                        </button>
                    </div>
                </section>

                <section class="control-group">
                    <div class="section-label">
                        <label>Job types</label>
                        <i class="fas fa-briefcase"></i>
                    </div>
                    <div id="jobTypesList" class="editable-list"></div>
                    <div class="joined-input">
                        <input type="text" id="newJobType" placeholder="Add job type">
                        <button id="addJobType" class="icon-button accent" type="button" title="Add job type">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </section>

                <section class="control-group">
                    <div class="section-label">
                        <label>Locations</label>
                        <i class="fas fa-location-dot"></i>
                    </div>
                    <div id="locationsList" class="editable-list"></div>
                    <div class="joined-input">
                        <input type="text" id="newLocation" placeholder="Add location">
                        <button id="addLocation" class="icon-button accent" type="button" title="Add location">
                            <i class="fas fa-plus"></i>
                        </button>
                    </div>
                </section>

                <section class="control-group">
                    <div class="section-label">
                        <label>Sources</label>
                        <i class="fas fa-layer-group"></i>
                    </div>
                    <div class="source-options">
                        <label>
                            <input type="checkbox" name="source" value="indeed" checked>
                            <span><i class="fas fa-briefcase"></i> Indeed</span>
                        </label>
                        <label>
                            <input type="checkbox" name="source" value="linkedin" checked>
                            <span><i class="fab fa-linkedin"></i> LinkedIn</span>
                        </label>
                        <label>
                            <input type="checkbox" name="source" value="glassdoor" checked>
                            <span><i class="fas fa-door-open"></i> Glassdoor</span>
                        </label>
                    </div>
                </section>

                <section class="control-group compact">
                    <label class="toggle-row">
                        <input type="checkbox" id="notifyOnNewJobs" checked>
                        <span>Notify on new jobs</span>
                    </label>
                </section>
            </aside>

            <section class="results-panel">
                <div class="results-header">
                    <div>
                        <span class="eyebrow">Live results</span>
                        <h2>Tracked opportunities</h2>
                    </div>
                    <div class="metrics">
                        <div class="metric">
                            <span>Total jobs</span>
                            <strong id="totalJobs">0</strong>
                        </div>
                        <div class="metric highlight">
                            <span>New jobs</span>
                            <strong id="newJobs">0</strong>
                        </div>
                    </div>
                </div>

                <div class="jobs-table">
                    <div class="table-head">
                        <div>Title</div>
                        <div>Company</div>
                        <div>Location</div>
                        <div>Source</div>
                        <div>Status</div>
                    </div>
                    <div id="jobList" class="job-list">
                        <div class="empty-state">
                            <i class="fas fa-magnifying-glass-chart"></i>
                            <span>No jobs yet. Start a search to populate this board.</span>
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="renderer.js"></script>
</body>
</html>
